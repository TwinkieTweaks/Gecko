name: C++ Unit Tests

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Visual Studio command prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Build solution
      run: msbuild Gecko.sln /p:Configuration=Release /p:Platform=x64

    - name: Run tests
      run: vstest.console.exe x64/Release/Gecko.dll /Platform:x64