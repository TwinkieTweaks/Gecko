name: Run tests

on:
  push:
    branches: [ "development" ]
  pull_request:
    branches: [ "development" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Visual Studio command prompt
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache intermediate files
      uses: actions/cache@v4
      with:
        path: Intermediates
        key: ${{ runner.os }}-msbuild-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-msbuild-

    - name: Build solution
      run: msbuild Gecko.sln /p:Configuration=Release /p:Platform=x64

    - name: Run tests
      run: vstest.console.exe Builds/x64/Release/Gecko.dll /Platform:x64